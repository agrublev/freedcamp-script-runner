name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    branches:
      - Development
    types:
      - closed
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: yarn install --frozen-lockfile
      - run: bun scripts/bun.build.mjs
      - run: cd website && yarn install --frozen-lockfile
      - run: cd website && yarn build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FSCR_4A87C }}
          projectId: fscr-4a87c
          entryPoint: website
