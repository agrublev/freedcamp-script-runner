[package]
name = "fsr"
version = "7.6.1"
description = "Runs scripts documented in fscripts.md (Rust port)"
license = "MIT"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
nix = { version = "0.31.3", features = ["signal", "process"] }
pulldown-cmark = { version = "0.13.5", default-features = false }
signal-hook = "0.4.5"

[dev-dependencies]
tempfile = "3.27.0"
