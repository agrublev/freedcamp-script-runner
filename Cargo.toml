[package]
name = "fsr"
version = "7.7.0"
description = "Runs scripts documented in fscripts.md (Rust port)"
license = "MIT"
edition = "2024"

[dependencies]
aes = "0.8"
anyhow = "1.0.104"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
dialoguer = "0.12.0"
hex = "0.4.3"
md-5 = "0.10"
nucleo-matcher = "0.3"
pulldown-cmark = { version = "0.13.5", default-features = false }
rand = "0.8"
ratatui = "0.30.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "system-proxy"] }
rpassword = "7.5.4"
scrypt = { version = "0.11", default-features = false }
serde_json = "1.0.154"
sha2 = { version = "0.10", default-features = false }
tempfile = "3.27.0"
unicode-width = "0.2.2"
walkdir = "2.5.0"
which = "8.0.6"
zeroize = "1.9.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }
signal-hook = "0.4.5"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31.3", features = ["signal", "process", "term", "fs"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Test helper: a picker that panics mid-render (tests/rust_terminal.rs).
[[example]]
name = "ui_panic"
path = "tests/support/ui_panic.rs"
