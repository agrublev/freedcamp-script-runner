[package]
name = "fscr"
version = "7.6.1"
edition = "2024"
description = "Runs scripts documented in fscripts.md"
license = "MIT"
include = ["src/**", "lib/completions/scripts/**", "Cargo.toml", "Cargo.lock", "Readme.md", "LICENSE"]

[[bin]]
name = "fsr"
path = "src/main.rs"

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
md-5 = "0.10"
pulldown-cmark = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
scrypt = "0.11"
walkdir = "2"
